name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kontrola a testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Typy (typecheck)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formátování
        run: npm run format:check
      - name: Velikost souborů (základ 33)
        run: npm run check:size
      - name: Testy jádra (Vitest)
        run: npm test
      - name: Prohlížeč pro e2e
        run: npx playwright install --with-deps chromium
      - name: Testy v prohlížeči (Playwright)
        run: npm run test:e2e
      - name: Sestavení sandboxu
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: apps/sandbox/dist

  deploy:
    name: Nasazení na GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
