<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp interakce BIM-light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Rozložení: nástroje vlevo, výkres uprostřed, vlastnosti vpravo, stavový řádek dole (sekce 10 katalogu). */
:root{
  --paper:#f7f5ef; --panel:#fdfcf9; --ink:#1c2128; --muted:#677080; --line:#d9d5c9;
  --accent:#0f6b8f; --tmp:#d9480f; --perm:#1d4ed8; --snap:#3aa6f4; --bad:#b42318;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--sans);display:grid;grid-template-rows:44px 1fr 30px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#top{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
#top h1{font-size:14px;font-weight:600;margin:0 10px 0 0;white-space:nowrap}
#top h1 span{color:var(--muted);font-weight:400}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 10px;min-height:28px}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
#top .sp{flex:1}
#main{display:grid;grid-template-columns:64px minmax(0,1fr) 288px;min-height:0}
#tools{overflow:auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 2px;font-size:12px}
.tool kbd{font:500 11px var(--mono);color:var(--muted)}
.tool:hover{background:#fff;border-color:var(--line)}
.tool[aria-pressed="true"]{background:#e3f0f5;border-color:var(--accent);color:var(--accent)}
.tool svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.cmdb{display:flex;flex-direction:column;align-items:center;gap:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 2px;font-size:11px;line-height:1.2}
.cmdb kbd{font:500 10px var(--mono);color:var(--muted)}
.cmdb:hover{background:#fff;border-color:var(--line)}
.cmdb[aria-pressed="true"]{background:#e3f0f5;border-color:var(--accent);color:var(--accent)}
.tsep{height:1px;background:var(--line);margin:2px 6px;flex:none}
#wrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tracker{position:absolute;pointer-events:none;display:none;background:#fff;border:1px solid var(--ink);border-radius:6px;padding:3px 8px;font:500 12px var(--mono);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.15);gap:12px}
#tracker .f{opacity:.6}
#tracker .f.on{opacity:1;color:var(--accent)}
#tracker .f.on b{border-bottom:2px solid var(--accent)}
#snaplbl{position:absolute;pointer-events:none;display:none;background:#e3f2fd;color:#0b3d66;border:1px solid #3aa6f4;border-radius:4px;padding:1px 6px;font:500 11px var(--sans);white-space:nowrap}
#edit{position:absolute;display:none;width:88px;font:500 13px var(--mono);border:2px solid var(--accent);border-radius:4px;padding:2px 5px;background:#fff;color:#1c2128;caret-color:#1c2128;text-align:right}
#pal{position:absolute;display:none;background:#fff;border:1px solid var(--ink);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:4px;min-width:150px;z-index:5}
#pal .ttl{font-size:11px;color:var(--muted);padding:2px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
#pal button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:5px;padding:6px 10px}
#pal button:hover:not([disabled]){background:#e3f0f5}
#pal button[disabled]{color:#a3a39c;cursor:not-allowed}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;max-width:min(560px,92%);background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;gap:12px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:6}
#toast.bad{background:var(--bad)}
#toast button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:5px;padding:2px 8px;white-space:nowrap}
#side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:14px}
#side h2{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px;font-weight:600}
.row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.row label{flex:0 0 96px;color:var(--muted);font-size:13px}
.row select,.row input{flex:1;min-width:0;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff}
.seg{display:flex;flex:1}
.seg button{flex:1;border:1px solid var(--line);background:#fff;padding:4px 6px}
.seg button:first-child{border-radius:6px 0 0 6px}
.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.seg button[aria-pressed="true"]{background:#e3f0f5;border-color:var(--accent);color:var(--accent)}
.try{margin:0;padding-left:18px;color:#39414d;font-size:13px}
.try li{margin-bottom:5px}
.try kbd{font:500 11px var(--mono);background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.legend{font-size:12px;color:var(--muted);display:grid;grid-template-columns:auto 1fr;gap:3px 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-top:4px}
#status{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:#39414d;min-width:0}
#status #hint{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status #pos{font-family:var(--mono);color:var(--muted)}
@media (max-width:900px){
  body{grid-template-rows:44px 1fr 30px}
  #main{grid-template-columns:56px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 200px}
  #side{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}
  #top h1 span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header id="top">
  <h1>BIM-light <span>prototyp interakce, stěny a kóty</span></h1>
  <button class="btn" id="bUndo" title="Zpět (Ctrl+Z)">Zpět</button>
  <button class="btn" id="bRedo" title="Vpřed (Ctrl+Y)">Vpřed</button>
  <span class="sp"></span>
  <button class="btn" id="bDemo" title="Vrátit ukázkový půdorys">Ukázka</button>
  <button class="btn" id="bClear" title="Smazat všechno">Vymazat</button>
</header>
<div id="main">
  <nav id="tools" aria-label="Nástroje">
    <button class="tool" data-tool="select" aria-pressed="true" title="Výběr (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10.5 19z"/></svg>Výběr<kbd>V</kbd></button>
    <button class="tool" data-tool="wall" aria-pressed="false" title="Stěna (W)"><svg viewBox="0 0 24 24"><path d="M3 15l12-12 6 6-12 12z"/><path d="M8 10l6 6"/></svg>Stěna<kbd>W</kbd></button>
    <button class="tool" data-tool="dim" aria-pressed="false" title="Kóta (D)"><svg viewBox="0 0 24 24"><path d="M4 6v12M20 6v12M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/></svg>Kóta<kbd>D</kbd></button>
    <div class="tsep"></div><button class="cmdb" data-cmd="move" aria-pressed="false" title="Přesun (M)">Přesun<kbd>M</kbd></button><button class="cmdb" data-cmd="copy" aria-pressed="false" title="Kopie (K)">Kopie<kbd>K</kbd></button><button class="cmdb" data-cmd="rotate" aria-pressed="false" title="Otočit (R)">Otočit<kbd>R</kbd></button><button class="cmdb" data-cmd="mirror" aria-pressed="false" title="Zrcadlit (F)">Zrcadlit<kbd>F</kbd></button><button class="cmdb" data-cmd="array" aria-pressed="false" title="Pole (P)">Pole<kbd>P</kbd></button><button class="cmdb" data-cmd="align" aria-pressed="false" title="Zarovnat (L)">Zarovnat<kbd>L</kbd></button><button class="cmdb" data-cmd="trim" aria-pressed="false" title="Do rohu (T)">Do rohu<kbd>T</kbd></button><button class="cmdb" data-cmd="split" aria-pressed="false" title="Rozdělit (X)">Rozdělit<kbd>X</kbd></button><button class="cmdb" data-cmd="rect" aria-pressed="false" title="Obdélník (B)">Obdélník<kbd>B</kbd></button><button class="cmdb" data-cmd="ang" aria-pressed="false" title="Úhel (U)">Úhel<kbd>U</kbd></button>
  </nav>
  <div id="wrap">
    <canvas id="cv" tabindex="0" aria-label="Výkres"></canvas>
    <div id="tracker"></div>
    <div id="snaplbl"></div>
    <input id="edit" type="text" inputmode="decimal" aria-label="Nová hodnota kóty v milimetrech">
    <div id="pal"></div>
    <div id="zoom"><button class="btn" id="zIn" aria-label="Přiblížit">+</button><button class="btn" id="zOut" aria-label="Oddálit">−</button><button class="btn" id="zFit">Celé</button><button class="btn" id="zSel" title="Přiblížit na výběr (Z)">Výběr</button><button class="btn" id="zWin" title="Přiblížit oknem (Z bez výběru)">Okno</button></div>
    <div id="toast" role="status"></div>
  </div>
  <aside id="side" aria-label="Vlastnosti"></aside>
</div>
<footer id="status"><span id="hint"></span><span id="pos"></span></footer>

<script>
'use strict';
/* ========= pomocné funkce (mm, y nahoru) ========= */
const $=s=>document.querySelector(s);
const V=(x,y)=>({x,y});
const add=(a,b)=>V(a.x+b.x,a.y+b.y), sub=(a,b)=>V(a.x-b.x,a.y-b.y), mul=(a,k)=>V(a.x*k,a.y*k);
const dot=(a,b)=>a.x*b.x+a.y*b.y, cross=(a,b)=>a.x*b.y-a.y*b.x, vlen=a=>Math.hypot(a.x,a.y);
const dist=(a,b)=>vlen(sub(a,b)), norm=a=>{const l=vlen(a)||1;return V(a.x/l,a.y/l)}, lnorm=d=>V(-d.y,d.x);
const rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI, mid=(a,b)=>V((a.x+b.x)/2,(a.y+b.y)/2);
const angDiff=(a,b)=>Math.abs((((a-b+Math.PI)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)-Math.PI);
const r10=v=>Math.round(v/10)*10;
const fmt=n=>String(Math.round(n*10)/10).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function lineInter(p1,d1,p2,d2){const den=cross(d1,d2);if(Math.abs(den)<1e-9)return null;const t=cross(sub(p2,p1),d2)/den;return add(p1,mul(d1,t));}
function segInter(a,b,c,d){const r=sub(b,a),s=sub(d,c),den=cross(r,s);if(Math.abs(den)<1e-9)return null;const t=cross(sub(c,a),s)/den,u=cross(sub(c,a),r)/den;if(t<-1e-9||t>1+1e-9||u<-1e-9||u>1+1e-9)return null;return add(a,mul(r,t));}
function nearestOnSeg(p,a,b){const ab=sub(b,a),l2=dot(ab,ab);if(l2<1e-9)return{p:a,t:0};let t=dot(sub(p,a),ab)/l2;t=Math.max(0,Math.min(1,t));return{p:add(a,mul(ab,t)),t};}
function rayHit(o,r,a,b){const e=sub(b,a),den=cross(r,e);if(Math.abs(den)<1e-9)return null;const s=cross(sub(a,o),e)/den,u=cross(sub(a,o),r)/den;if(s<=1e-6||u<-1e-9||u>1+1e-9)return null;return{s,p:add(o,mul(r,s))};}
function pointInPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a.y>p.y)!==(b.y>p.y)&&p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
const MONO="'IBM Plex Mono',ui-monospace,Consolas,monospace",PAPER='#f7f5ef',AUX='#3aa6f4',INK='#1c2128';
const dimTxt=v=>{const r=Math.round(v*10)/10;return String(r%1===0?r:r.toFixed(1)).replace('.',',');};
const parseNum=s=>parseFloat(String(s).replace(',','.'));

/* ========= model ========= */
let S, undoSt=[], redoSt=[], G={};
function demo(){
  return {
    seq:100,aligns:{},
    types:[{id:'t450',name:'Zdivo 450',t:450},{id:'t300',name:'Zdivo 300',t:300},{id:'t100',name:'Příčka 100',t:100}],
    nodes:{n1:V(0,0),n2:V(0,3200),n3:V(4500,3200),n4:V(4500,0),n5:V(2600,0),n6:V(2600,1900)},
    walls:[
      {id:'w1',a:'n1',b:'n2',type:'t450',side:'L'},
      {id:'w2',a:'n2',b:'n3',type:'t450',side:'L'},
      {id:'w3',a:'n3',b:'n4',type:'t450',side:'L'},
      {id:'w4',a:'n4',b:'n1',type:'t450',side:'L'},
      {id:'w5',a:'n5',b:'n6',type:'t100',side:'L'}],
    dims:[]
  };
}
const getW=id=>S.walls.find(w=>w.id===id);
const typeOf=w=>S.types.find(t=>t.id===w.type)||S.types[0];
const wallsAtNode=nid=>S.walls.filter(w=>w.a===nid||w.b===nid);
function wallInfo(w){const A=S.nodes[w.a],B=S.nodes[w.b],d=norm(sub(B,A)),n=lnorm(d),t=typeOf(w).t,sg=w.side==='L'?1:-1;return{A,B,d,n,t,sg,off:mul(n,sg*t)};}
/* Zdi se napojují v rozích (základ 10): na každém konci se líce protnou s lícem sousední stěny. */
function endPts(w,key){
  const g=wallInfo(w),N=key==='a'?g.A:g.B,out=key==='a'?g.d:mul(g.d,-1),ln=lnorm(out);
  const tOff=g.sg*g.t*dot(g.n,ln);
  let refP=N,offP=add(N,g.off);
  const others=wallsAtNode(w[key]).filter(x=>x.id!==w.id);
  if(others.length===1){
    const X=others[0],gx=wallInfo(X),kx=X.a===w[key]?'a':'b',outX=kx==='a'?gx.d:mul(gx.d,-1),lnX=lnorm(outX);
    const tOffX=gx.sg*gx.t*dot(gx.n,lnX);
    const WL={p:add(N,mul(ln,Math.max(0,tOff))),d:out},WR={p:add(N,mul(ln,Math.min(0,tOff))),d:out};
    const XL={p:add(N,mul(lnX,Math.max(0,tOffX))),d:outX},XR={p:add(N,mul(lnX,Math.min(0,tOffX))),d:outX};
    const pl=lineInter(WL.p,WL.d,XR.p,XR.d),pr=lineInter(WR.p,WR.d,XL.p,XL.d),lim=6*Math.max(g.t,gx.t)+1;
    if(pl&&pr&&dist(pl,N)<lim&&dist(pr,N)<lim){ if(tOff>0){offP=pl;refP=pr;}else{refP=pl;offP=pr;} }
  }
  return{ref:refP,off:offP};
}
function refreshGeo(){G={};for(const w of S.walls){const a=endPts(w,'a'),b=endPts(w,'b');G[w.id]={poly:[a.ref,b.ref,b.off,a.off],faces:{ref:[a.ref,b.ref],off:[a.off,b.off],axis:[mid(a.ref,a.off),mid(b.ref,b.off)]}};}}
const faceSeg=(wid,f)=>G[wid].faces[f];
const refFaceLen=w=>{const a=endPts(w,'a'),b=endPts(w,'b');return dist(a.ref,b.ref);};
const nodeAt=(p,e=1)=>Object.keys(S.nodes).find(k=>dist(S.nodes[k],p)<e)||null;
function plainPoly(A,B,t,sg){const d=norm(sub(B,A)),o=mul(lnorm(d),sg*t);return[A,B,add(B,o),add(A,o)];}

/* ========= kóty a zámky (části 3 a 4) ========= */
function dimValue(d){
  if(d.kind==='ang'){const g=angGeom(d);return g?g.ang:NaN;}
  if(d.kind==='len'){const w=getW(d.w);return w?refFaceLen(w):NaN;}
  const sa=faceSeg(d.a.w,d.a.f),sb=faceSeg(d.b.w,d.b.f),bd=norm(sub(sb[1],sb[0]));
  return Math.abs(cross(bd,sub(mid(sa[0],sa[1]),sb[0])));
}
function violations(){return S.dims.filter(d=>d.locked&&Math.abs(dimValue(d)-d.value)>(d.kind==='ang'?0.05:0.5));}
function commit(label,fn){
  const snap=JSON.stringify(S);fn();refreshGeo();
  const bad=violations();
  if(bad.length){
    S=JSON.parse(snap);refreshGeo();U.flash={ids:bad.map(b=>b.id),until:performance.now()+2600};
    const b=bad[0];
    toast('Změna se neprovedla: porušila by zamčenou kótu '+fmt(b.value)+' mm. Zvýrazněná kóta brání.','bad',{label:'Odemknout kótu',fn:()=>{const dd=S.dims.find(x=>x.id===b.id);if(dd){dd.locked=false;}panel();redraw();}});
    redraw();return false;
  }
  undoSt.push(snap);redoSt=[];if(undoSt.length>200)undoSt.shift();
  panel();redraw();return true;
}
function doUndo(){if(!undoSt.length)return false;redoSt.push(JSON.stringify(S));S=JSON.parse(undoSt.pop());refreshGeo();if(U.sel&&!getW(U.sel))U.sel=null;U.multi=U.multi.filter(id=>getW(id));if(U.selDim&&!S.dims.find(x=>x.id===U.selDim))U.selDim=null;panel();redraw();return true;}
function doRedo(){if(!redoSt.length)return;undoSt.push(JSON.stringify(S));S=JSON.parse(redoSt.pop());refreshGeo();panel();redraw();}

/* Posun stěny kolmo: natáhnou se všechny stěny, které na ni navazují (na konci i uprostřed, i šikmé). Ostatní zůstane. */
function pointNearPoly(p,poly,tol){
  if(pointInPoly(p,poly))return true;
  for(let i=0;i<poly.length;i++){const n=nearestOnSeg(p,poly[i],poly[(i+1)%poly.length]);if(dist(n.p,p)<=tol)return true;}
  return false;
}
function attachedNodes(w){ // uzly cizích stěn ležící na stěně (T napojení uprostřed)
  const poly=G[w.id].poly,out=[];
  for(const k in S.nodes){
    if(k===w.a||k===w.b)continue;
    if(wallsAtNode(k).some(x=>x.id===w.id))continue;
    if(pointNearPoly(S.nodes[k],poly,2))out.push(k);
  }
  return out;
}
function slideTarget(nid,np,g,wid){ // uzel klouže po přímce první napojené stěny, která není rovnoběžná s posouvanou
  for(const X of wallsAtNode(nid).filter(x=>x.id!==wid)){
    const gx=wallInfo(X),far=X.a===nid?gx.B:gx.A,dX=sub(far,S.nodes[nid]);
    if(Math.abs(cross(norm(dX),g.d))<0.02)continue;
    const I=lineInter(np,g.d,far,dX);if(I)return I;
  }
  return np;
}
function moveWallPerp(wid,v){
  refreshGeo();
  const w=getW(wid),g=wallInfo(w),res={};
  for(const nid of [w.a,w.b,...attachedNodes(w)])res[nid]=slideTarget(nid,add(S.nodes[nid],v),g,wid);
  for(const k in res)S.nodes[k]=res[k];
}
/* Změna délky: konec se posune po směru stěny, napojená kolmá stěna se posune s ním (a jedna další se natáhne). */
function moveNodeFollow(nid,v,exceptWid){
  const others=wallsAtNode(nid).filter(x=>x.id!==exceptWid),pre=others.map(X=>{const gx=wallInfo(X),far=X.a===nid?X.b:X.a;return{X,far,dX:sub(S.nodes[far],S.nodes[nid])};});
  S.nodes[nid]=add(S.nodes[nid],v);
  if(others.length!==1)return;
  const {X,far,dX}=pre[0],par=Math.abs(cross(norm(dX),norm(v)))<0.02;
  if(par)return;
  S.nodes[far]=add(S.nodes[far],v);
}
function setLength(wid,end,L){
  const w=getW(wid),g=wallInfo(w),delta=L-refFaceLen(w);
  moveNodeFollow(w[end],mul(g.d,(end==='b'?1:-1)*delta),wid);
}
function setThickness(wid,t){
  let ty=S.types.find(x=>x.t===t),isNew=false;
  if(!ty){ty={id:'t'+(S.seq++),name:'Zdivo '+t,t};S.types.push(ty);isNew=true;}
  getW(wid).type=ty.id;return{ty,isNew};
}
function removeWall(wid){
  S.walls=S.walls.filter(w=>w.id!==wid);
  S.dims=S.dims.filter(d=>d.kind==='len'?d.w!==wid:(d.a.w!==wid&&d.b.w!==wid));
  for(const k of Object.keys(S.nodes))if(!wallsAtNode(k).length)delete S.nodes[k];
}

/* ========= zobrazení ========= */

function allCorners(){const c=[];for(const id in G)G[id].poly.forEach(p=>c.push(p));return c;}

  }
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)for(const f of ['ref','off'])for(const h of ['ref','off']){
    const a=G[ids[i]].faces[f],b=G[ids[j]].faces[h],x=segInter(a[0],a[1],b[0],b[1]);if(x&&near(x))out.push({p:x,kind:'průsečík',pri:1});}

function resolve(raw,o){

  }
  U.cKey='';const corners=allCorners();

    const v=sub(raw,o.from),L=vlen(v);

      const phi=Math.atan2(v.y,v.x),th0=o.prevDir==null?0:o.prevDir,step=o.shift?90:45;let best=null;
      for(let k=0;k<360/step;k++){const a=th0+rad(k*step),dd=angDiff(phi,a),ang=k*step;
        const lbl=ang===0?(o.prevDir==null?'vodorovně':'rovně'):ang===180?'zpět':ang%90===0?(o.prevDir==null?'svisle':'pravý úhel'):'45°';
        if(!best||dd<best.dd)best={a,dd,lbl};}

      if(o.shift||best.dd<rad(4)){
        const u=V(Math.cos(best.a),Math.sin(best.a)),L0=Math.max(0,dot(v,u));let p=add(o.from,mul(u,r10(L0))),guides=[],kind=best.lbl;
        const base=add(o.from,mul(u,L0));let bg=null;

          if(Math.abs(u.x)>0.05){const Lg=(P.x-o.from.x)/u.x;if(Lg>0){const Q=add(o.from,mul(u,Lg)),dq=dist(Q,base);if(dq<tol&&(!bg||dq<bg.dq))bg={Q,P,dq};}}

  return{p,snap:(gx||gy)?{kind:'pomocná čára',n:1}:null,guides};
}

/* ========= dávka 2: příkazy nad výběrem, úpravy, úhlová kóta, zoom ========= */
function srcFromIds(ids){const nodes={},walls=[];for(const id of ids){const w=getW(id);if(!w)continue;nodes[w.a]=V(S.nodes[w.a].x,S.nodes[w.a].y);nodes[w.b]=V(S.nodes[w.b].x,S.nodes[w.b].y);walls.push({a:w.a,b:w.b,type:w.type,side:w.side});}return{nodes,walls};}
function srcCenter(src){const ps=Object.values(src.nodes);if(!ps.length)return V(0,0);const xs=ps.map(p=>p.x),ys=ps.map(p=>p.y);return V((Math.min(...xs)+Math.max(...xs))/2,(Math.min(...ys)+Math.max(...ys))/2);}
function mergeCoincident(newNodes){
  for(const nn of newNodes){if(!S.nodes[nn])continue;
    for(const k in S.nodes){if(k===nn)continue;if(dist(S.nodes[k],S.nodes[nn])<1){for(const w of S.walls){if(w.a===nn)w.a=k;if(w.b===nn)w.b=k;}delete S.nodes[nn];break;}}}
  S.walls=S.walls.filter(w=>w.a!==w.b);
}
function instantiate(src,xf,flip){
  const map={},ids=[];
  for(const k in src.nodes){const nn='n'+(S.seq++);S.nodes[nn]=xf(src.nodes[k]);map[k]=nn;}
  for(const w of src.walls){const id='w'+(S.seq++);S.walls.push({id,a:map[w.a],b:map[w.b],type:w.type,side:flip?(w.side==='L'?'R':'L'):w.side});ids.push(id);}
  mergeCoincident(Object.values(map));
  return ids.filter(id=>getW(id));
}
function rotP(p,pv,a){const c=Math.cos(a),s=Math.sin(a),d=sub(p,pv);return V(pv.x+d.x*c-d.y*s,pv.y+d.x*s+d.y*c);}
function mirP(p0,d){return p=>{const v=sub(p,p0),t=dot(v,d);return V(p0.x+2*t*d.x-v.x,p0.y+2*t*d.y-v.y);};}
/* Přesun a otočení: pohnou se jen vybrané stěny, navazující se natáhnou (konec i uprostřed), ostatní stojí. */
function moveWalls(ids,v){
  refreshGeo();const nodes=new Set(),att={};
  for(const id of ids){const w=getW(id);nodes.add(w.a);nodes.add(w.b);}
  for(const id of ids){const w=getW(id),g=wallInfo(w);for(const nid of attachedNodes(w)){if(nodes.has(nid))continue;att[nid]={g,id};}}
  const res={};
  for(const nid of nodes)res[nid]=add(S.nodes[nid],v);
  for(const nid in att)res[nid]=slideTarget(nid,add(S.nodes[nid],v),att[nid].g,att[nid].id);
  for(const k in res)S.nodes[k]=res[k];
}
function rotateWalls(ids,pv,a){
  refreshGeo();const nodes=new Set(),att={};
  for(const id of ids){const w=getW(id);nodes.add(w.a);nodes.add(w.b);}
  for(const id of ids){const w=getW(id),g=wallInfo(w);for(const nid of attachedNodes(w)){if(nodes.has(nid))continue;att[nid]={g:{d:rotP(g.d,V(0,0),a)},id};}}
  const res={};
  for(const nid of nodes)res[nid]=rotP(S.nodes[nid],pv,a);
  for(const nid in att)res[nid]=slideTarget(nid,rotP(S.nodes[nid],pv,a),att[nid].g,att[nid].id);
  for(const k in res)S.nodes[k]=res[k];
}
function splitWall(wid,t){
  const w=getW(wid),g=wallInfo(w),L=dist(g.A,g.B);if(t<=1||t>=L-1){toast('Rozdělení je moc blízko konci stěny.','bad');return false;}
  return commit('Rozdělit',()=>{const nn='n'+(S.seq++);S.nodes[nn]=add(g.A,mul(g.d,t));const old=w.b;w.b=nn;S.walls.push({id:'w'+(S.seq++),a:nn,b:old,type:w.type,side:w.side});S.dims=S.dims.filter(d=>d.kind==='len'?d.w!==w.id:(d.a.w!==w.id&&d.b.w!==w.id));});
}
function trimToCorner(w1,p1,w2,p2){
  refreshGeo();const a=getW(w1),b=getW(w2),ga=wallInfo(a),gb=wallInfo(b);
  const I=lineInter(ga.A,ga.d,gb.A,gb.d);if(!I){toast('Stěny jsou rovnoběžné, roh z nich nevznikne.','bad');return false;}
  const endOf=(g,p)=>dot(sub(p,g.A),g.d)<dot(sub(I,g.A),g.d)?'b':'a';
  const ea=endOf(ga,p1),eb=endOf(gb,p2);
  return commit('Oříznout do rohu',()=>{const nn='n'+(S.seq++);S.nodes[nn]=V(I.x,I.y);const olds=[a[ea],b[eb]];a[ea]=nn;b[eb]=nn;for(const o of olds)if(S.nodes[o]&&!wallsAtNode(o).length)delete S.nodes[o];});
}
function alignTo(ref,tgt){
  if(ref.w===tgt.w){toast('Vyber líc jiné stěny, než je referenční.','bad');return false;}
  refreshGeo();const sr=faceSeg(ref.w,ref.f),st=faceSeg(tgt.w,tgt.f),dr=norm(sub(sr[1],sr[0])),dt=norm(sub(st[1],st[0]));
  if(Math.abs(cross(dr,dt))>0.02){toast('Líce nejsou rovnoběžné, nelze je zarovnat.','bad');return false;}
  const n=lnorm(dr),d=dot(sub(sr[0],st[0]),n);
  if(Math.abs(d)<0.5){toast('Líce už jsou zarovnané.','ok');return true;}
  return commit('Zarovnat',()=>moveWallPerp(tgt.w,mul(n,d)));
}
function makeRect(p1,p2){
  const x0=Math.min(p1.x,p2.x),x1=Math.max(p1.x,p2.x),y0=Math.min(p1.y,p2.y),y1=Math.max(p1.y,p2.y);
  if(x1-x0<10||y1-y0<10){toast('Obdélník je moc malý.','bad');return false;}
  const pts=[V(x0,y1),V(x1,y1),V(x1,y0),V(x0,y0)];let made=[];
  const ok=commit('Obdélník stěn',()=>{const ns=pts.map(p=>{let n=nodeAt(p);if(!n){n='n'+(S.seq++);S.nodes[n]=V(p.x,p.y);}return n;});for(let i=0;i<4;i++){const id='w'+(S.seq++);S.walls.push({id,a:ns[i],b:ns[(i+1)%4],type:U.typeId,side:U.side});made.push(id);}});
  if(ok)U.made=made;return ok;
}
function zoomToBox(x0,y0,x1,y1){
  const s=Math.min((Wd-160)/Math.max(1,x1-x0),(Hd-160)/Math.max(1,y1-y0));
  view.s=Math.max(0.03,Math.min(1.2,s));view.ox=Wd/2-(x0+x1)/2*view.s;view.oy=Hd/2+(y0+y1)/2*view.s;redraw();
}
function zoomSel(){
  refreshGeo();const ids=selIds();if(!ids.length)return;let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
  for(const id of ids){const b=wallBBox(id);x0=Math.min(x0,b.x0);y0=Math.min(y0,b.y0);x1=Math.max(x1,b.x1);y1=Math.max(y1,b.y1);}
  zoomToBox(x0,y0,x1,y1);
}
/* úhlová kóta */
function angGeom(d){
  const a=getW(d.a.w),b=getW(d.b.w);if(!a||!b)return null;
  const ga=wallInfo(a),gb=wallInfo(b),I=lineInter(ga.A,ga.d,gb.A,gb.d);if(!I)return null;
  let u1=sub(mid(ga.A,ga.B),I),u2=sub(mid(gb.A,gb.B),I);
  u1=vlen(u1)<1?ga.d:norm(u1);u2=vlen(u2)<1?gb.d:norm(u2);
  return{I,u1,u2,ang:deg(Math.acos(Math.max(-1,Math.min(1,dot(u1,u2))))),sgn:cross(u1,u2)>=0?1:-1};
}
function angTxt(v){return String(Math.round(v*10)/10).replace('.',',')+'°';}
function addAngDim(w1,w2){
  if(w1===w2){toast('Vyber dvě různé stěny.','bad');return false;}
  const g=angGeom({a:{w:w1},b:{w:w2}});if(!g){toast('Stěny jsou rovnoběžné, úhel nemají.','bad');return false;}
  return commit('Kóta úhlu',()=>{const nd={kind:'ang',a:{w:w1},b:{w:w2},id:'d'+(S.seq++),locked:false,value:0,r:700};S.dims.push(nd);nd.value=g.ang;});
}
function drawAngDim(d,val,fl){
  const g=angGeom(d);if(!g)return;const r=d.r||700,c0=toS(g.I),R=r*view.s;
  const col=fl?'#b42318':(isDimSel(d.id)?AUX:INK);

document.addEventListener('keydown',e=>{

  const typing=(U.tool==='wall'&&U.chain)||(U.mode2&&(U.mode2.k==='offset'||U.mode2.k==='addpoint'));
  if(typing){
    const fld=U.tool==='wall'&&U.chain?U.typed.f:'len';
    if(/^[0-9.,]$/.test(k)){e.preventDefault();const ch=k===','?'.':k;if(ch==='.'&&U.typed[fld].includes('.'))return;U.typed[fld]+=ch;updateCursorResult();return;}
    if(k==='Backspace'){e.preventDefault();if(U.typed[fld]!==''){U.typed[fld]=U.typed[fld].slice(0,-1);updateCursorResult();}else if(U.tool==='wall'&&U.chain)backChain();return;}
    if(k==='Tab'&&U.tool==='wall'&&U.chain){e.preventDefault();U.typed.f=U.typed.f==='len'?'ang':'len';updateCursorResult();return;}
    if(k==='Enter'){e.preventDefault();

  }
  if(k==='c'||k==='C'){U.cycle++;updateCursorResult();return;}
  if(k===' '&&U.tool==='select'&&selIds().length>1){e.preventDefault();const ids=selIds();commit('Strana',()=>{for(const id of ids){const w=getW(id);w.side=w.side==='L'?'R':'L';}});panel();return;}
  if(k===' '&&U.tool==='select'&&U.sel&&getW(U.sel)){e.preventDefault();const id=U.sel;if(commit('Strana',()=>{const w=getW(id);w.side=w.side==='L'?'R':'L';}))toast('Tloušťka stěny teď jde '+(getW(id).side==='L'?'doleva':'doprava')+' od jejího směru.','ok');return;}
  if(k===' '&&U.tool==='wall'){e.preventDefault();U.side=U.side==='L'?'R':'L';panel();toast('Tloušťka teď jde '+(U.side==='L'?'doleva':'doprava')+' od směru kreslení.','ok');redraw();return;}
  if(k==='Escape'){if(U.placing){finishDimMove(U.placing,true);U.placing=null;resetDimChain();setHint();redraw();return;}if(U.palOpen)closePal();else if(U.mode2)cancelMode2();else if(U.dimFirst){resetDimChain();setHint();redraw();}else if(U.tool!=='select')setTool('select');else if(U.selDim||U.selDims.length){U.selDim=null;U.selDims=[];redraw();}else{setSel([]);panel();setHint();redraw();}return;}
  if(k==='Delete'&&U.tool==='select'&&U.selDims.length){const dids=new Set(U.selDims),wids=selIds();setSel([]);commit('Smazat',()=>{for(const id of wids)if(getW(id))removeWall(id);S.dims=S.dims.filter(d=>!dids.has(d.id));});panel();setHint();return;}
  if(k==='Delete'&&U.tool==='select'&&U.selDim){const id=U.selDim;U.selDim=null;commit('Smazat kótu',()=>{S.dims=S.dims.filter(x=>x.id!==id);});return;}
  if(k==='Delete'&&U.tool==='select'&&selIds().length){const ids=selIds();setSel([]);commit('Smazat',()=>{for(const id of ids)if(getW(id))removeWall(id);});panel();setHint();return;}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='a'&&U.tool==='select'){e.preventDefault();setSel(S.walls.map(w=>w.id));U.selDims=S.dims.map(d=>d.id);panel();setHint();redraw();return;}
  const lk=k.toLowerCase();
  if(k.startsWith('Arrow')&&U.tool==='select'&&!U.cmd&&selIds().length){e.preventDefault();const st=e.shiftKey?100:e.ctrlKey?1000:10,v={ArrowLeft:V(-st,0),ArrowRight:V(st,0),ArrowUp:V(0,st),ArrowDown:V(0,-st)}[k];const ids=selIds();commit('Posun šipkou',()=>moveWalls(ids,v));return;}
  if(k==='Tab'&&U.tool==='select'&&!U.cmd){e.preventDefault();const under=S.walls.filter(w=>pointInPoly(U.cursorW,G[w.id].poly)).map(w=>w.id);if(under.length>1){const i=under.indexOf(U.sel);const id=under[(i+1)%under.length];setSel([id]);panel();setHint();toast('Stěna '+(((i+1)%under.length)+1)+' z '+under.length+' pod kurzorem.','ok');redraw();}return;}
  if(k==='Home'){fit();return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const map={m:'move',k:'copy',r:'rotate',f:'mirror',p:'array',l:'align',t:'trim',x:'split',u:'ang',b:'rect'};
    if(map[lk]){startCmd(map[lk]);return;}
    if(lk==='z'){if(selIds().length)zoomSel();else startCmd('zoomwin');return;}
    if(lk==='v')setTool('select');if(lk==='w')setTool('wall');if(lk==='d')setTool('dim');
  }
});
document.addEventListener('keyup',e=>{U.shift=e.shiftKey;U.alt=e.altKey;if(U.inside)updateCursorResult();});

/* ========= panely a texty ========= */
function setTool(t){U.tool=t;U.chain=null;U.mode2=null;U.cmd=null;resetDimChain();syncTools();U.typed.len='';U.typed.ang='';U.typed.f='len';closePal();
  document.querySelectorAll('.tool').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tool===t)));
  if(t!=='select'&&false)U.sel=null;panel();setHint();updateCursorResult();}
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{setTool(b.dataset.tool);cv.focus();}));
document.querySelectorAll('.cmdb').forEach(b=>b.addEventListener('click',()=>{startCmd(b.dataset.cmd);cv.focus();}));
function setHint(){
  let h='';
  if(U.cmd){const hs=CMDH[U.cmd.k];h=hs[Math.min(U.cmd.step,hs.length-1)];}
  else if(U.mode2){h={movenode:'Klikni na nové místo uzlu. Napojené stěny se natáhnou. Esc zruší.',offset:'Posuň myší a klikni, nebo napiš číslo a Enter. Posune se celá stěna, tloušťka zůstane. Esc zruší.',addpoint:'Klikni na místo rozdělení, nebo napiš vzdálenost od začátku a Enter. Esc zruší.'}[U.mode2.k];}
  else if(U.tool==='wall')h=U.chain?'Klikni na konec, nebo piš číslo (délka). Tab = úhel, Enter potvrdí, mezerník přehodí stranu, C = další přichycení, Alt vypne přichytávání, Esc ukončí řetěz.':'Klikni na počátek stěny.';
  else if(U.tool==='dim')h=U.dimChainPrev?'Klikej na další líce (každý jednou), celá řada se nese s myší. Klik do prázdna řadu umístí a ukončí. Shift+klik na líc přeskočí úsek. Esc řadu nechá na místě.':U.dimFirst?'Klikni na druhý líc.':'Klikni na první líc, pak na druhý. Dál klikej na další líce pro řetězovou kótu.';
  else if(U.selDims.length)h='Vybráno '+U.selDims.length+' kót'+(U.multi.length||U.sel?' a stěny':'')+'. Del smaže vše vybrané, Shift+klik na kótu přidá nebo ubere, Esc zruší výběr.';
  else if(U.multi.length>1)h='Vybráno '+U.multi.length+' stěn. Del smaže, Shift+klik přidá nebo ubere, Esc zruší výběr. Typ, tloušťku a stranu měníš v panelu pro všechny.';
  else h=U.sel?'Táhni čtvereček u konce (posun uzlu) nebo líc (odsazení). Pravé tlačítko = nabídka. Klik na číslo kóty ho změní, tažení kótu posune. Mezerník přehodí stranu, Del smaže.':'Klikni na stěnu. Tažením prázdného místa vybereš více stěn (zleva doprava jen celé, zprava doleva i protnuté), Shift+klik přidává, Ctrl+A vybere vše.';
  $('#hint').textContent=h;
}
function panel(){
  const ids=selIds(),multi=ids.length>1,sel=U.sel&&getW(U.sel),w=sel?getW(U.sel):null,wr=w||(multi?getW(ids[0]):null);
  const typeOpts=(cur)=>S.types.map(t=>'<option value="'+t.id+'"'+(t.id===cur?' selected':'')+'>'+t.name+'</option>').join('');
  let h='<section><h2>'+(w?'Vybraná stěna':multi?'Vybráno '+ids.length+' stěn':'Nová stěna')+'</h2>';
  h+='<div class="row"><label for="pType">Typ</label><select id="pType">'+typeOpts(wr?wr.type:U.typeId)+'</select></div>';
  if(wr){h+='<div class="row"><label for="pT">Tloušťka (mm)</label><input id="pT" type="text" inputmode="decimal" value="'+typeOf(wr).t+'" title="Enter: stěna dostane typ s touto tloušťkou"></div>';
    if(w)h+='<div class="row"><label>Délka (líc)</label><span style="font-family:var(--mono)">'+fmt(refFaceLen(w))+' mm</span></div>';}
  h+='<div class="row"><label>Tloušťka jde</label><div class="seg"><button data-side="L" aria-pressed="'+((wr?wr.side:U.side)==='L')+'">doleva</button><button data-side="R" aria-pressed="'+((wr?wr.side:U.side)==='R')+'">doprava</button></div></div>';
  h+='<div class="row"><label>Reference</label><span style="color:var(--muted)">vnitřní líc (pevně)</span></div></section>';
  if(U.cmd&&U.cmd.k==='array')h+='<section><h2>Pole</h2><div class="row"><label for="pArr">Počet (s originálem)</label><input id="pArr" type="text" inputmode="numeric" value="'+U.arrN+'"></div></section>';
  h+='<section><h2>Dočasné kóty měří k</h2><div class="seg"><button data-dm="face" aria-pressed="'+(U.dimMode==='face')+'">lícům</button><button data-dm="axis" aria-pressed="'+(U.dimMode==='axis')+'">osám</button></div></section>';
  h+='<section><h2>Co vyzkoušet</h2><ol class="try"><li><kbd>W</kbd>, klikni a pohybuj myší: úhly se lepí na 90° a 45°, délka po 10 mm. Napiš <kbd>3200</kbd> a <kbd>Enter</kbd>.</li><li><kbd>Tab</kbd> přepne na úhel. <kbd>90</kbd> je zatáčka doprava, <kbd>270</kbd> doleva.</li><li><kbd>Mezerník</kbd> přehodí stranu tloušťky (i u vybrané stěny), <kbd>Alt</kbd> vypne přichytávání, <kbd>C</kbd> střídá kandidáty.</li><li><kbd>V</kbd>, klikni na stěnu: dočasné kóty. Klikni na číslo, napiš novou hodnotu, <kbd>Enter</kbd>.</li><li>Kolečko u kóty ji uloží jako trvalou, zámek ji zamkne. Táhni za kótu a posune se. Zkus změnit jinou kótu tak, aby zámek porušila.</li><li>Táhni čtvereček na konci vybrané stěny: posune uzel a u cizího uzlu se napojí. Táhni líc: odsazení. Pravé tlačítko: nabídka.</li><li>Změň tloušťku v tomto panelu.</li></ol></section>';
  h+='<section><h2>Přichytávání</h2><div class="legend"><i style="border:2px solid #3aa6f4"></i><span>konec</span><i style="background:#3aa6f4;clip-path:polygon(50% 0,100% 100%,0 100%)"></i><span>střed</span><i style="background:linear-gradient(45deg,transparent 40%,#3aa6f4 40% 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,#3aa6f4 40% 60%,transparent 60%)"></i><span>průsečík</span><i style="border:2px solid #3aa6f4;border-radius:50%"></i><span>líc, kolmo, osa, pomocná čára</span></div></section>';
  $('#side').innerHTML=h;
  const pt=$('#pType');pt.onchange=()=>{if(ids.length)commit('Typ',()=>{for(const id of ids)getW(id).type=pt.value;});else{U.typeId=pt.value;}cv.focus();};
  const pA=$('#pArr');if(pA)pA.addEventListener('input',()=>{const n=parseInt(pA.value,10);if(n>=2&&n<=200)U.arrN=n;updateCursorResult();});
  const pT=$('#pT');if(pT)pT.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const v=parseNum(pT.value);if(isNaN(v)||v<=0)return;let info;
    const ok=commit('Tloušťka',()=>{for(const id of ids)info=setThickness(id,v);});if(ok&&info)toast('Stěně přiřazen typ „'+info.ty.name+'“ ('+(info.isNew?'nový typ':'existující typ')+'). Referenční líc zůstal na místě.','ok');});
}
$('#side').addEventListener('click',e=>{
  const s=e.target.closest('button[data-side]'),d=e.target.closest('button[data-dm]');
  if(s){const v=s.dataset.side,ids=selIds();if(ids.length)commit('Strana',()=>{for(const id of ids)getW(id).side=v;});else{U.side=v;panel();}cv.focus();}
  if(d){U.dimMode=d.dataset.dm;panel();redraw();}
});
let toastT=0;
function toast(msg,kind,action){
  const t=$('#toast');t.className=kind==='bad'?'bad':'';t.style.display='flex';t.innerHTML='<span></span>';t.firstChild.textContent=msg;
  if(action){const b=document.createElement('button');b.textContent=action.label;b.onclick=()=>{action.fn();t.style.display='none';};t.appendChild(b);}
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},action?7000:4200);
}
/* ========= záhlaví ========= */
$('#bUndo').onclick=()=>{if(U.tool==='wall'&&U.chain&&U.chain.stack.length)backChain();else doUndo();};
$('#bRedo').onclick=doRedo;
$('#bDemo').onclick=()=>{S=demo();undoSt=[];redoSt=[];U.sel=null;U.chain=null;refreshGeo();fit();panel();setHint();};
$('#bClear').onclick=()=>{commit('Vymazat',()=>{S.walls=[];S.nodes={};S.dims=[];});U.sel=null;U.chain=null;panel();redraw();};
$('#zIn').onclick=()=>zoomAt(V(Wd/2,Hd/2),1.25);$('#zOut').onclick=()=>zoomAt(V(Wd/2,Hd/2),0.8);$('#zSel').onclick=()=>{if(selIds().length)zoomSel();else toast('Nejdřív vyber stěny.','bad');cv.focus();};$('#zWin').onclick=()=>{startCmd('zoomwin');cv.focus();};
$('#zFit').onclick=fit;
new ResizeObserver(resize).observe($('#wrap'));
window.addEventListener('resize',resize);

S=demo();refreshGeo();resize();fit();panel();setHint();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(redraw);
</script>
</body>
